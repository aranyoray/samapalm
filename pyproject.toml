[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palmppg"
version = "0.1.0"
description = "SWHT-PP-003 camera palm photoplethysmography pilot: capture, sync, analysis, audits, reports"
requires-python = ">=3.11"
license = {text = "Proprietary - study use"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "opencv-python-headless>=4.8",
  "neurokit2>=0.2.7",
  "scikit-learn>=1.3",
  "lightgbm>=4",
  "xgboost>=2",
  "catboost>=1.2",
  "statsmodels>=0.14",
  "PyWavelets>=1.4",
  "zarr>=2.16",
  "matplotlib>=3.8",
  "mlflow>=2.9",
  "pillow>=10",
  "pymupdf>=1.23",
  "reportlab>=4",
  "av>=11",
  "networkx>=3",
  "tqdm>=4",
  "jsonschema>=4",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]
capture = ["picamera2", "gpiozero"]
hands = ["mediapipe>=0.10"]
ecgmodel = ["torch>=2.1", "onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=7", "pytest-cov", "hypothesis", "ruff"]

[project.scripts]
palmppg = "palmppg.cli:main"

[tool.setuptools.packages.find]
include = ["palmppg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "slow: long-running tests (positive control, compression study)",
  "deep: requires torch",
  "hands: requires mediapipe",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
