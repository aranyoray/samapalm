# Builds the onboarding app APK (GitHub's Ubuntu runners have the Android SDK), runs the shared-engine Kotlin tests,
# and runs the Python contract tests (schema engine, Supabase schema on Postgres 16, Apps Script exporter, CRF pull).
name: onboarding
on:
  push:
    paths: ["android/**", "configs/crf_schema.json", "configs/crf_fixtures/**", "supabase/**", "appscript/**",
            "palmppg/core/crf*.py", "palmppg/capture/crf_pull.py", "tests/test_core_crf*.py", "tests/test_supabase_schema.py",
            "tests/test_capture_crf_pull.py", "tests/test_appscript_exporter.py", ".github/workflows/onboarding.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared engine tests (golden fixtures, navigator, Supabase client)
        run: ./gradlew :crf-core:test --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: samahealth-onboarding-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install pytest numpy pandas pyyaml
      - name: Contract tests
        run: python -m pytest -q tests/test_core_crf.py tests/test_core_crf_schema.py tests/test_supabase_schema.py tests/test_capture_crf_pull.py tests/test_appscript_exporter.py
