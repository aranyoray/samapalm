# Builds the onboarding app APK (GitHub's Ubuntu runners have the Android SDK), runs the shared-engine Kotlin tests,
# and runs the Python contract tests (schema engine, Supabase schema on Postgres 16, Apps Script exporter, CRF pull).
name: onboarding
on:
  push:
    paths: ["android/**", "configs/crf_schema.json", "configs/crf_fixtures/**", "configs/quality_fixtures/**",
            "configs/recruitment_targets.json", "supabase/**", "appscript/**",
            "palmppg/core/crf*.py", "palmppg/core/strata.py", "palmppg/quality/**", "palmppg/capture/crf_pull.py",
            "tests/test_core_crf*.py", "tests/test_core_strata.py", "tests/test_supabase_schema.py",
            "tests/test_capture_crf_pull.py", "tests/test_appscript_exporter.py", "tests/test_quality_onsite.py",
            "palmppg/ecg/founder_prep.py", "configs/founder_fixtures/**", "tests/test_founder_prep.py",
            ".github/workflows/onboarding.yml"]
  workflow_dispatch:
    inputs:
      build_model:
        description: "Also download the ECGFounder weights, export ONNX and build an APK with the model in it"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared engine tests (golden fixtures, navigator, Supabase client)
        run: ./gradlew :crf-core:test --console=plain
      - name: Quality tests (grades and the Kardia PDF reader against the shared fixtures)
        run: ./gradlew :quality-core:test --console=plain
      - name: ECGFounder preprocessing (the Kotlin port against the Python golden fixtures)
        run: ./gradlew :ecg-model:test --console=plain
      - name: App JVM tests (recorder controls, YUV maths, participant page, Room migration)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: samahealth-onboarding-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # The research model is optional: it is built on demand because the weights are 370 MB and the exported graph
  # is ~123 MB, which would make every APK that size. The APK it produces is a separate artifact.
  model:
    if: github.event_name == 'workflow_dispatch' && inputs.build_model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the model tools
        # --index-url replaces PyPI rather than adding to it, so scipy was being looked for on the torch
        # index and not found. Only torch comes from there.
        run: |
          pip install numpy scipy pyyaml onnx onnxruntime
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download the 1-lead weights
        env:
          HF_URL: https://huggingface.co/PKUDigitalHealth/ECGFounder/resolve/main/1_lead_ECGFounder.pth
        run: |
          mkdir -p work/ecgfounder
          curl -sSL --retry 3 -o work/ecgfounder/1_lead_ECGFounder.pth "$HF_URL"
          echo "f863a38897fb49a27fec7e44008ea3c7bdbd29c77fa4a02ecbb8c56df4f37603  work/ecgfounder/1_lead_ECGFounder.pth" | sha256sum -c -
      - name: Export to ONNX and check ONNX Runtime against torch
        run: python tools/export_ecgfounder_onnx.py --weights work/ecgfounder/1_lead_ECGFounder.pth
      - name: Bundle the model into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp work/ecgfounder/ecgfounder_1lead_fp32.onnx android/app/src/main/assets/
      - name: Build the debug APK with the model
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: samahealth-onboarding-debug-apk-with-model
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            work/ecgfounder/ecgfounder_1lead_fp32.onnx
            work/ecgfounder/ecgfounder_1lead_fp32.report.json

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install pytest numpy pandas pyyaml scipy
      - name: Contract tests
        run: >
          python -m pytest -q tests/test_core_crf.py tests/test_core_crf_schema.py tests/test_core_strata.py
          tests/test_supabase_schema.py tests/test_capture_crf_pull.py tests/test_appscript_exporter.py
          tests/test_quality_onsite.py tests/test_founder_prep.py tests/test_core_lint.py
